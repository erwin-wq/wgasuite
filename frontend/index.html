<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%230f766e' d='M32 4 55 12v17c0 15-9.8 25.6-23 31C18.8 54.6 9 44 9 29V12z'/%3E%3Cpath fill='white' d='m20 21 5.5 22h6l3.5-12 3.5 12h6L50 21h-5.8l-3.1 13.7L37.2 21h-4.4l-3.9 13.7L25.8 21z'/%3E%3C/svg%3E"
    />
    <title>WGASuite</title>
    <script>
      (() => {
        const fallback = "navy-teal";
        const allowed = new Set([fallback, "cobalt-ice", "graphite-copper"]);
        let theme = fallback;
        try {
          const stored = JSON.parse(localStorage.getItem("wgasuite.ui.theme.active.v1") || "null");
          if (stored?.version === 1 && typeof stored.account === "string" && allowed.has(stored.theme)) {
            theme = stored.theme;
          }
        } catch {
          // Use the safe default when storage is unavailable or corrupted.
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme === "graphite-copper" ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
